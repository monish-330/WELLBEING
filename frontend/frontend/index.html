<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Wellbeing Platform</title>
    <script>
      (function() {
        var path = window.location.pathname;
        if (path && path !== "/" && path !== "/index.html" && !path.startsWith("/api") && !path.startsWith("/assets") && !window.location.hash) {
          window.location.replace("/#" + path + window.location.search);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
